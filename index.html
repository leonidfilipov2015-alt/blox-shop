
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10101c">
    <title>Blox Shop</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #10101c;
            color: white;
            font-family: Arial, sans-serif;
        }

        .header {
            text-align: center;
            padding: 20px 10px;
            background: linear-gradient(135deg, #342080, #111b42);
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 5px;
            font-size: 30px;
        }

        .header p {
            color: #c9c9dc;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            cursor: pointer;
            border: none;
            color: white;
            font-weight: bold;
        }

        .tab {
            flex: 1;
            padding: 14px 5px;
            background: #24243a;
            border-radius: 12px;
        }

        .tab.active {
            background: #713cff;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .product {
            background: #202035;
            border: 1px solid #343450;
            border-radius: 16px;
            padding: 15px 10px;
            text-align: center;
        }

        .emoji {
            font-size: 48px;
            margin: 10px;
        }

        .product h3 {
            font-size: 16px;
            margin: 8px 0;
        }

        .price {
            color: #b99aff;
            font-weight: bold;
            margin: 12px 0;
        }

        .buy {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7545ff, #4922c9);
            border-radius: 10px;
        }

        .buy:active, .tab:active {
            opacity: 0.7;
        }

        .status {
            text-align: center;
            color: #aaa;
            padding: 30px 10px;
            grid-column: 1 / -1;
        }

        .admin {
            margin-top: 30px;
            padding: 15px;
            background: #202035;
            border-radius: 16px;
        }

        .admin h2 {
            text-align: center;
        }

        .admin input, .admin select {
            display: block;
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border-radius: 9px;
            border: 1px solid #444;
            background: #141424;
            color: white;
        }

        .admin button {
            width: 100%;
            padding: 13px;
            background: #713cff;
            border-radius: 10px;
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            color: #777;
            margin-top: 30px;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>🔥 BLOX SHOP</h1>
    <p>Магазин Blox Fruits и Steal a Brainrot</p>
    <p>🛒 Лучшие товары по хорошим ценам!</p>
</div>

<div class="tabs">
    <button class="tab active" id="bloxTab"
        onclick="showProducts('blox')">
        🍎 Blox Fruits
    </button>

    <button class="tab" id="brainrotTab"
        onclick="showProducts('brainrot')">
        🧠 Brainrot
    </button>
</div>

<div class="products" id="products">
    <div class="status">⏳ Загружаем товары...</div>
</div>

<div class="admin hidden" id="adminPanel">
    <h2>⚙️ Добавить товар</h2>

    <input id="productName" placeholder="Название товара">
    <input id="productPrice" placeholder="Цена товара">
    <input id="productEmoji" placeholder="Эмодзи товара (например 🍎)">

    <select id="productCategory">
        <option value="blox">Blox Fruits</option>
        <option value="brainrot">Steal a Brainrot</option>
    </select>

    <button onclick="addProduct()">➕ Добавить товар</button>
</div>

<footer>
    Blox Shop 2.0 © 2026
</footer>

<script>
const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor("#10101c");
    tg.setBackgroundColor("#10101c");
}

const API_URL = "https://bloxshop-backend.onrender.com";
const SELLER_ID = 7580041056;

let allProducts = [];
let currentCategory = "blox";

// Загрузка товаров
async function loadProducts() {
    const container = document.getElementById("products");

    container.innerHTML =
        '<div class="status">⏳ Загружаем товары...</div>';

    try {
        const response = await fetch(API_URL + "/api/products");

        if (!response.ok) {
            throw new Error("Ошибка сервера: " + response.status);
        }

        const data = await response.json();

        allProducts = Array.isArray(data)
            ? data
            : (data.products || []);

        showProducts(currentCategory);

        if (allProducts.length === 0) {
            container.innerHTML =
                '<div class="status">📦 Пока нет товаров. Загляни позже!</div>';
        }

    } catch (error) {
        console.error("Ошибка загрузки:", error);

        container.innerHTML =
            '<div class="status">' +
            '❌ Не удалось загрузить товары.<br><br>' +
            'Проверь подключение к серверу и попробуй обновить страницу.' +
            '<br><br><button class="buy" onclick="loadProducts()">🔄 Повторить</button>' +
            '</div>';
    }
}

// Переключение категорий
function showProducts(category) {
    currentCategory = category;

    document.getElementById("bloxTab")
        .classList.toggle("active", category === "blox");

    document.getElementById("brainrotTab")
        .classList.toggle("active", category === "brainrot");

    const container = document.getElementById("products");

    container.innerHTML = "";

    const filtered = allProducts.filter(
        product => product.category === category
    );

    if (filtered.length === 0) {
        container.innerHTML =
            '<div class="status">📦 В этой категории пока нет товаров.</div>';
        return;
    }

    filtered.forEach(product => {
        const card = document.createElement("div");
        card.className = "product";

        const emoji = document.createElement("div");
        emoji.className = "emoji";
        emoji.textContent = product.emoji || "🎁";

        const name = document.createElement("h3");
        name.textContent = product.name || "Товар";

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = "💰 " + (product.price ?? "Цена не указана");

        const buy = document.createElement("button");
        buy.className = "buy";
        buy.textContent = "🛒 Купить";

        buy.onclick = () => buyProduct(product);

        card.append(emoji, name, price, buy);
        container.appendChild(card);
    });
}

// Покупка товара
function buyProduct(product) {
    const message =
        "Здравствуйте! Хочу купить товар из Blox Shop:\n\n" +
        "📦 " + product.name + "\n" +
        "💰 Цена: " + product.price + "\n\n" +
        "Мой Telegram ID: " +
        (tg?.initDataUnsafe?.user?.id || "Не определён");

    const shareUrl =
        "https://t.me/share/url?url=" +
        encodeURIComponent("https://t.me/") +
        "&text=" + encodeURIComponent(message);

    if (tg) {
        tg.openTelegramLink(shareUrl);
    } else {
        window.open(shareUrl, "_blank");
    }
}

// Добавление товара администратором
async function addProduct() {
    const name = document.getElementById("productName").value.trim();
    const price = document.getElementById("productPrice").value.trim();
    const emoji = document.getElementById("productEmoji").value.trim();
    const category = document.getElementById("productCategory").value;

    if (!name || !price) {
        alert("Заполни название и цену товара!");
        return;
    }

    if (!tg?.initData) {
        alert("Открой магазин через Telegram!");
        return;
    }

    try {
        const response = await fetch(API_URL + "/api/products", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-Telegram-Init-Data": tg.initData
            },
            body: JSON.stringify({
                name,
                price,
                emoji: emoji || "🎁",
                category
            })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(result.error || "Не удалось добавить товар");
        }

        alert("✅ Товар добавлен!");

        document.getElementById("productName").value = "";
        document.getElementById("productPrice").value = "";
        document.getElementById("productEmoji").value = "";

        await loadProducts();

    } catch (error) {
        console.error(error);
        alert("❌ Ошибка: " + error.message);
    }
}

// Запуск магазина
loadProducts();
</script>

</body>
</html>
