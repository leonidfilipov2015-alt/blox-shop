<script>
const tg = window.Telegram?.WebApp;
const API_URL = "https://bloxshop-backend.onrender.com";

if (tg) {
    tg.ready();
    tg.expand();
}

// Начальные товары магазина
let products = {
    blox: [
        { name: "Лайтинг", price: "25 Robux", emoji: "⚡" },
        { name: "Шадоу", price: "10 Robux", emoji: "🌑" },
        { name: "Мамонт", price: "15 Robux", emoji: "🦣" },
        { name: "Портал", price: "15 Robux", emoji: "🌀" },
        { name: "Тесто", price: "Уточнить", emoji: "🍩" },
        { name: "Газ", price: "Уточнить", emoji: "☁️" }
    ],
    brainrot: [
        { name: "Брейнрот 1", price: "Уточнить", emoji: "🧠" },
        { name: "Брейнрот 2", price: "Уточнить", emoji: "🐸" },
        { name: "Брейнрот 3", price: "Уточнить", emoji: "🦈" }
    ]
};

// Показ товаров
window.showProducts = function(category, button) {
    const container = document.getElementById("products");

    if (!container || !products[category]) return;

    container.innerHTML = "";

    document.querySelectorAll("nav button").forEach(btn => {
        btn.classList.remove("active");
    });

    if (button) {
        button.classList.add("active");
    }

    products[category].forEach(product => {
        container.innerHTML += `
            <div class="product">
                <div class="emoji">${product.emoji}</div>
                <h3>${product.name}</h3>
                <div class="price">${product.price}</div>
                <button class="buy"
                    onclick="buyProduct('${product.name}')">
                    💬 Купить
                </button>
            </div>
        `;
    });
};

// Загрузка товаров с сервера
window.loadProducts = async function() {
    try {
        const response = await fetch(API_URL + "/api/products");

        if (!response.ok) {
            throw new Error("Ошибка загрузки товаров");
        }

        const data = await response.json();

        if (data.length > 0) {
            products = {
                blox: data.filter(p => p.category === "blox"),
                brainrot: data.filter(p => p.category === "brainrot")
            };
        }

        const activeButton =
            document.querySelector("nav button.active");

        showProducts("blox", activeButton);

    } catch (error) {
        console.error("Ошибка сервера:", error);

        const button = document.querySelector("nav button.active");
        showProducts("blox", button);
    }
};

// Покупка товара
window.buyProduct = function(name) {
    const productsIds = {
        "Лайтинг": "lighting",
        "Шадоу": "shadow",
        "Мамонт": "mammoth",
        "Портал": "portal",
        "Тесто": "dough",
        "Газ": "gas",
        "Брейнрот 1": "brainrot1",
        "Брейнрот 2": "brainrot2",
        "Брейнрот 3": "brainrot3"
    };

    const productId = productsIds[name];

    if (!productId) {
        alert("Товар пока нельзя купить.");
        return;
    }

    window.open(
        "https://t.me/BloxShopLegend_bot?start=buy_" + productId,
        "_blank"
    );
};

// Открытие админ-панели
window.showAdminPanel = function() {
    const container = document.getElementById("products");

    container.innerHTML = `
        <h2>⚙️ Админ-панель</h2>

        <input id="productName" placeholder="Название товара">

        <input id="productPrice" placeholder="Цена">

        <input id="productEmoji" placeholder="Эмодзи">

        <select id="productCategory">
            <option value="blox">Blox Fruits</option>
            <option value="brainrot">Brainrot</option>
        </select>

        <button onclick="addProduct()">
            ➕ Добавить товар
        </button>
    `;
};

// Добавление товара
window.addProduct = async function() {
    const name = document.getElementById("productName").value.trim();
    const price = document.getElementById("productPrice").value.trim();
    const emoji =
        document.getElementById("productEmoji").value.trim() || "🎁";
    const category = document.getElementById("productCategory").value;

    if (!name || !price) {
        alert("Заполни название и цену!");
        return;
    }

    if (!tg || !tg.initData) {
        alert("Открой магазин через Telegram!");
        return;
    }

    try {
        const response = await fetch(API_URL + "/api/products", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-Telegram-Init-Data": tg.initData
            },
            body: JSON.stringify({
                name: name,
                price: price,
                emoji: emoji,
                category: category
            })
        });

        const result = await response.json();

        if (!response.ok) {
            alert(result.error || "Не удалось добавить товар");
            return;
        }

        alert("Товар добавлен!");

        await loadProducts();

    } catch (error) {
        console.error(error);
        alert("Ошибка соединения с сервером");
    }
};

// Запуск магазина
loadProducts();
</script>
